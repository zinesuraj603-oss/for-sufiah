<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Sufiah (sufiyana✨)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-butter: #FFFDF0;
            --yellow-pastel: #FFF3B0;
            --yellow-warm: #FFE169;
            --yellow-deep: #F5B700;
            --pink-ribbon: #FF8DA1;
            --brown-ink: #4A3525;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-butter);
            color: var(--brown-ink);
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100dvh;
            width: 100vw;
            position: relative;
            transition: background-color 0.7s ease;
        }

        /* Cute Kawaii Stationery Gingham + Polka Backdrop */
        .kawaii-backdrop {
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(#FFE57F 2px, transparent 2px),
                linear-gradient(to right, rgba(255, 243, 176, 0.35) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 243, 176, 0.35) 1px, transparent 1px);
            background-size: 28px 28px, 56px 56px, 56px 56px;
            z-index: 0;
            pointer-events: none;
        }

        h1, h2, .font-display {
            font-family: 'Fredoka', sans-serif;
        }

        /* Kawaii 3D Card Styling */
        .kawaii-card {
            background: rgba(255, 255, 255, 0.95);
            border: 3.5px solid #4A3525;
            box-shadow: 0 10px 0 #4A3525, 0 18px 30px rgba(245, 183, 0, 0.22);
            border-radius: 32px;
            position: relative;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Decorative corner lace bows on card */
        .card-stitch {
            border: 2px dashed #FFE169;
            border-radius: 24px;
            padding: 20px 18px;
        }

        /* Kawaii 3D Pill Buttons */
        .btn-kawaii-primary {
            background: linear-gradient(180deg, #FFEA79 0%, #FFD23F 100%);
            border: 3px solid #4A3525;
            box-shadow: 0 5px 0 #4A3525;
            color: #4A3525;
            font-family: 'Fredoka', sans-serif;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .btn-kawaii-primary:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #4A3525;
        }

        .btn-kawaii-pink {
            background: linear-gradient(180deg, #FFB3C1 0%, #FF8DA1 100%);
            border: 3px solid #4A3525;
            box-shadow: 0 5px 0 #4A3525;
            color: #4A3525;
            font-family: 'Fredoka', sans-serif;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .btn-kawaii-pink:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #4A3525;
        }

        .btn-kawaii-secondary {
            background: #FFFDF7;
            border: 2.5px solid #4A3525;
            box-shadow: 0 4px 0 #4A3525;
            color: #6E5039;
            font-family: 'Fredoka', sans-serif;
            transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Floating SVG Flowers Animation */
        @keyframes floatFlower {
            0% {
                transform: translateY(108vh) rotate(0deg) scale(0.85);
                opacity: 0;
            }
            12% {
                opacity: 0.92;
            }
            88% {
                opacity: 0.92;
            }
            100% {
                transform: translateY(-14vh) rotate(360deg) scale(1.1);
                opacity: 0;
            }
        }

        .floating-svg-item {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            animation: floatFlower linear infinite;
        }

        @keyframes bobMascot {
            0%, 100% { transform: translateY(0px) rotate(-1.5deg); }
            50% { transform: translateY(-8px) rotate(1.5deg); }
        }

        .mascot-bob {
            animation: bobMascot 2.8s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.07); }
            50% { transform: scale(0.97); }
            75% { transform: scale(1.05); }
        }

        .heartbeat-anim {
            animation: heartbeat 0.95s ease-in-out infinite;
        }

        @keyframes cardPop {
            0% { opacity: 0; transform: scale(0.86) translateY(16px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .pop-enter {
            animation: cardPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes shakeCard {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-7px) rotate(-1.5deg); }
            40% { transform: translateX(7px) rotate(1.5deg); }
            60% { transform: translateX(-5px) rotate(-1deg); }
            80% { transform: translateX(5px) rotate(1deg); }
        }

        .shake-it {
            animation: shakeCard 0.42s ease-in-out;
        }

        /* Corner Flower Spin */
        @keyframes slowSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .spin-slow {
            animation: slowSpin 14s linear infinite;
        }

        /* Receipt perforation */
        .receipt-box {
            background: #FFFDF7;
            border: 2.5px dashed #4A3525;
            border-radius: 18px;
        }
    </style>
</head>

    <script>
        // ==========================================
        // 1. KAWAII SVG FLOWER & RIBBON GENERATOR
        //    (Zero emojis in background — 100% custom Kawaii art)
        // ==========================================
        const flowerContainer = document.getElementById('flowerContainer');

        const kawaiiSvgTemplates = [
            // 1. Smiling Pastel Yellow Daisy
            `<svg viewBox="0 0 64 64" class="w-full h-full">
                <g fill="#FFE169" stroke="#4A3525" stroke-width="3">
                    <circle cx="32" cy="13" r="10"/><circle cx="32" cy="51" r="10"/>

                </g>
                <circle cx="32" cy="32" r="11" fill="#FFFDF0" stroke="#4A3525" stroke-width="3"/>
                <circle cx="28.5" cy="30.5" r="1.8" fill="#4A3525"/>
                <circle cx="35.5" cy="30.5" r="1.8" fill="#4A3525"/>
                <path d="M29 34.5 Q32 37 35 34.5" stroke="#4A3525" stroke-width="2" fill="none" stroke-linecap="round"/>
            </svg>`,

            // 2. White & Butter Chamomile Flower
            `<svg viewBox="0 0 64 64" class="w-full h-full">
                <g fill="#FFFFFF" stroke="#4A3525" stroke-width="3">
                    <ellipse cx="32" cy="12" rx="8" ry="11"/>
                    <ellipse cx="32" cy="52" rx="8" ry="11"/>
                    <ellipse cx="12" cy="32" rx="11" ry="8"/>
                    <ellipse cx="52" cy="32" rx="11" ry="8"/>
                    <ellipse cx="18" cy="18" rx="9" ry="9"/>
                    <ellipse cx="46" cy="46" rx="9" ry="9"/>
                    <ellipse cx="46" cy="18" rx="9" ry="9"/>
                    <ellipse cx="18" cy="46" rx="9" ry="9"/>
                </g>
                <circle cx="32" cy="32" r="11" fill="#FFD23F" stroke="#4A3525" stroke-width="3"/>
                <circle cx="28.5" cy="31" r="1.7" fill="#4A3525"/>
                <circle cx="35.5" cy="31" r="1.7" fill="#4A3525"/>
                <path d="M29.5 34.5 Q32 36.5 34.5 34.5" stroke="#4A3525" stroke-width="2" fill="none" stroke-linecap="round"/>
            </svg>`,

            // 3. Five-Petal Golden Buttercup Blossom
            `<svg viewBox="0 0 64 64" class="w-full h-full">
                <g fill="#FFF099" stroke="#4A3525" stroke-width="3">
                    <circle cx="32" cy="14" r="12"/>
                    <circle cx="50" cy="27" r="12"/>
                    <circle cx="43" cy="48" r="12"/>
                    <circle cx="21" cy="48" r="12"/>
                    <circle cx="14" cy="27" r="12"/>
                </g>
                <circle cx="32" cy="33" r="9" fill="#FF8DA1" stroke="#4A3525" stroke-width="3"/>
            </svg>`,

            // 4. Kawaii Pastel Yellow & Pink Ribbon Bow
            `<svg viewBox="0 0 64 64" class="w-full h-full">
                <path d="M32 32 C16 14, 6 22, 12 36 C16 44, 26 38, 32 32 Z" fill="#FFE169" stroke="#4A3525" stroke-width="3" stroke-linejoin="round"/>
                <path d="M32 32 C48 14, 58 22, 52 36 C48 44, 38 38, 32 32 Z" fill="#FFE169" stroke="#4A3525" stroke-width="3" stroke-linejoin="round"/>
                <path d="M28 35 L19 52 L27 49 L30 55 L32 36" fill="#FFE169" stroke="#4A3525" stroke-width="3" stroke-linejoin="round"/>
                <path d="M36 35 L45 52 L37 49 L34 55 L32 36" fill="#FFE169" stroke="#4A3525" stroke-width="3" stroke-linejoin="round"/>
                <circle cx="32" cy="32" r="6" fill="#FF8DA1" stroke="#4A3525" stroke-width="3"/>
            </svg>`,

            // 5. Kawaii Twinkle 4-Point Star
            `<svg viewBox="0 0 64 64" class="w-full h-full">
                <path d="M32 6 Q32 32 58 32 Q32 32 32 58 Q32 32 6 32 Q32 32 32 6 Z" fill="#FFD23F" stroke="#4A3525" stroke-width="3" stroke-linejoin="round"/>
                <circle cx="32" cy="32" r="3.5" fill="#FFFDF0"/>
            </svg>`
        ];

        function createFloatingFlowers(count = 16) {
            flowerContainer.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'floating-svg-item';
                const size = 24 + Math.floor(Math.random() * 20);
                wrapper.style.width = `${size}px`;
                wrapper.style.height = `${size}px`;
                wrapper.style.left = `${Math.random() * 94}vw`;
                wrapper.style.animationDuration = `${8 + Math.random() * 9}s`;
                wrapper.style.animationDelay = `${Math.random() * 6}s`;
                wrapper.innerHTML = kawaiiSvgTemplates[i % kawaiiSvgTemplates.length];
                flowerContainer.appendChild(wrapper);
            }
        }
        createFloatingFlowers(18);

        // ==========================================
        // 2. AUTOMATIC BACKGROUND MUSIC SYSTEM
        //    (Plays music.mp3 automatically on open / first touch)
        // ==========================================
        let audioCtx = null;
        let isMusicPlaying = false;
        let usingSynthFallback = false;
        let synthTimer = null;
        const bgMusicEl = document.getElementById('bgMusic');
        bgMusicEl.volume = 0.85;

        function ensureAudioCtx() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Cute UI Sound Effects
        function playSfx(type = 'pop') {
            try {
                ensureAudioCtx();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'pop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.09);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                    osc.start(now);
                    osc.stop(now + 0.09);
                } else if (type === 'dodge') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(660, now + 0.11);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
                    osc.start(now);
                    osc.stop(now + 0.11);
                } else if (type === 'heartbeat') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(115, now);
                    osc.frequency.exponentialRampToValueAtTime(55, now + 0.18);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'tada') {
                    const notes = [523.25, 659.25, 783.99, 1046.5];
                    notes.forEach((n, idx) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.type = 'triangle';
                        o.frequency.setValueAtTime(n, now + idx * 0.08);
                        g.gain.setValueAtTime(0.14, now + idx * 0.08);
                        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.35);
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.start(now + idx * 0.08);
                        o.stop(now + idx * 0.08 + 0.35);
                    });
                }
            } catch (e) {}
        }

        // Fallback music box if music.mp3 is missing
        const jaaneyaMelody = [
            { f: 392.00, d: 0.38 }, { f: 440.00, d: 0.38 }, { f: 493.88, d: 0.55 }, { f: 587.33, d: 0.75 },
            { f: 523.25, d: 0.40 }, { f: 493.88, d: 0.40 }, { f: 440.00, d: 0.45 }, { f: 392.00, d: 0.80 },
            { f: 440.00, d: 0.38 }, { f: 493.88, d: 0.38 }, { f: 523.25, d: 0.50 }, { f: 493.88, d: 0.40 },
            { f: 440.00, d: 0.45 }, { f: 392.00, d: 0.45 }, { f: 369.99, d: 0.45 }, { f: 392.00, d: 0.95 },
            { f: 493.88, d: 0.38 }, { f: 587.33, d: 0.42 }, { f: 659.25, d: 0.55 }, { f: 587.33, d: 0.65 },
            { f: 523.25, d: 0.42 }, { f: 493.88, d: 0.42 }, { f: 440.00, d: 0.85 }
        ];
        let noteIdx = 0;

        function playNextMelodyNote() {
            if (!isMusicPlaying || !usingSynthFallback) return;
            ensureAudioCtx();
            const note = jaaneyaMelody[noteIdx % jaaneyaMelody.length];
            noteIdx++;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const sub = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            sub.type = 'triangle';
            osc.frequency.setValueAtTime(note.f, now);
            sub.frequency.setValueAtTime(note.f / 2, now);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.065, now + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, now + note.d * 0.95);

            osc.connect(gain);
            sub.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            sub.start(now);
            osc.stop(now + note.d);
            sub.stop(now + note.d);

            synthTimer = setTimeout(playNextMelodyNote, note.d * 1000);
        }

        function startBackgroundMusic() {
            if (isMusicPlaying) return;
            bgMusicEl.play().then(() => {
                isMusicPlaying = true;

                if (bgMusicEl.error) {
                    isMusicPlaying = true;
                    usingSynthFallback = true;

                }
